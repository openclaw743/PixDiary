name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

# Cancel superseded runs on the same ref to save runner minutes.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  backend:
    name: Backend (lint / typecheck / test / build / docker)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: pixdiary
          POSTGRES_PASSWORD: pixdiary
          POSTGRES_DB: pixdiary_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U pixdiary -d pixdiary_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10

    env:
      # Integration tests in backend/tests/integration use this when set
      # (see backend/tests/integration/auth.test.ts) instead of spawning Docker.
      PIXDIARY_TEST_DATABASE_URL: postgres://pixdiary:pixdiary@localhost:5432/pixdiary_test
      # Satisfies config schema for unit tests that import config; never used
      # to talk to a real DB in unit paths.
      DATABASE_URL: postgres://pixdiary:pixdiary@localhost:5432/pixdiary_test
      JWT_SECRET: ci-not-a-real-secret-ci-not-a-real-secret
      NODE_ENV: test

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: backend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Test (unit + integration)
        run: npm test

      - name: Build (tsc)
        run: npm run build

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Docker build (no push)
        uses: docker/build-push-action@v6
        with:
          context: backend
          file: backend/Dockerfile
          push: false
          load: false
          tags: pixdiary-backend:ci-${{ github.sha }}
          cache-from: type=gha,scope=backend
          cache-to: type=gha,scope=backend,mode=max

  frontend:
    name: Frontend (lint / typecheck / test / build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm test

      - name: Build
        run: npm run build

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: frontend-dist-${{ github.sha }}
          path: frontend/dist
          retention-days: 7

  terraform:
    name: Terraform (fmt / validate)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: infra/terraform

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.9.8
          terraform_wrapper: false

      - name: Terraform fmt (check, recursive)
        run: terraform fmt -check -recursive

      - name: Terraform init (no backend) — dev env
        working-directory: infra/terraform/environments/dev
        run: terraform init -backend=false -input=false

      - name: Terraform validate — dev env
        working-directory: infra/terraform/environments/dev
        run: terraform validate -no-color
